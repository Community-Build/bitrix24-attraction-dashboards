name: Build Community Image

on:
  pull_request:
    paths:
      - ".github/workflows/build-community-image.yml"
      - "Dockerfile"
      - "apps/**"
      - "packages/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: community-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Resolve image target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REGISTRY_HOST: ${{ vars.COMMUNITY_REGISTRY_HOST }}
          REGISTRY_IMAGE: ${{ vars.COMMUNITY_REGISTRY_IMAGE }}
        run: |
          set -euo pipefail

          push_image=true
          if [ "$EVENT_NAME" = "pull_request" ]; then
            push_image=false
          fi

          if [ "$push_image" = "true" ] && { [ -z "$REGISTRY_HOST" ] || [ -z "$REGISTRY_IMAGE" ]; }; then
            printf 'Community registry variables are not configured\n' >&2
            exit 1
          fi

          if [ "$push_image" = "true" ]; then
            image_ref="${REGISTRY_IMAGE}:${GITHUB_SHA}"
          else
            image_ref="attraction-dashboard:${GITHUB_SHA}"
          fi

          printf 'push=%s\n' "$push_image" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

      - name: Log in to Community registry
        if: steps.target.outputs.push == 'true'
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ${{ vars.COMMUNITY_REGISTRY_HOST }}
          username: ${{ secrets.COMMUNITY_REGISTRY_USERNAME }}
          password: ${{ secrets.COMMUNITY_REGISTRY_PASSWORD }}

      - name: Build and optionally push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ steps.target.outputs.push == 'true' }}
          load: ${{ steps.target.outputs.push != 'true' }}
          tags: ${{ steps.target.outputs.image_ref }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=attraction-dashboard
          cache-to: type=gha,mode=max,scope=attraction-dashboard

      - name: Record immutable output
        env:
          IMAGE_REF: ${{ steps.target.outputs.image_ref }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            printf '### Community image\n\n'
            printf -- '- Revision: `%s`\n' "$GITHUB_SHA"
            printf -- '- Reference: `%s`\n' "$IMAGE_REF"
            if [ -n "$IMAGE_DIGEST" ]; then
              printf -- '- Digest: `%s`\n' "$IMAGE_DIGEST"
            else
              printf -- '- Digest: local build only\n'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

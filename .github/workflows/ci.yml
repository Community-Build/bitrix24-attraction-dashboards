name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, Typecheck, Test, Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Select test scope
        id: test-scope
        env:
          TEST_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-test-scope.mjs

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: MCP release tests
        if: steps.test-scope.outputs.scope == 'mcp'
        run: |
          node --test scripts/ci-test-scope.test.mjs scripts/deploy-production.test.mjs
          pnpm --filter @bitrix24-reporting/api exec vitest run test/attraction-data.test.ts test/agent-mcp-server.test.ts test/agent-mcp-http.test.ts test/attraction-agent-gateway.test.ts

      - name: Test
        if: steps.test-scope.outputs.scope != 'mcp'
        run: pnpm test

      - name: Build
        if: steps.test-scope.outputs.scope != 'mcp'
        run: pnpm build

      - name: Validate Compose
        run: ENV_FILE=.env.example docker compose -p bitrix24-reporting config >/dev/null

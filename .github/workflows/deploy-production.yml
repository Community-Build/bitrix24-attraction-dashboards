name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Candidate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Select test scope
        id: test-scope
        env:
          TEST_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-test-scope.mjs

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: MCP release tests
        if: steps.test-scope.outputs.scope == 'mcp'
        run: |
          node --test scripts/ci-test-scope.test.mjs scripts/deploy-production.test.mjs
          pnpm --filter @bitrix24-reporting/api exec vitest run test/attraction-data.test.ts test/agent-mcp-server.test.ts test/agent-mcp-http.test.ts test/attraction-agent-gateway.test.ts

      - name: Test
        if: steps.test-scope.outputs.scope != 'mcp'
        run: pnpm test

      - name: Build
        if: steps.test-scope.outputs.scope != 'mcp'
        run: pnpm build

  deploy:
    name: Deploy To VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_SSH_KEY"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/production_deploy_key
          chmod 600 ~/.ssh/production_deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
          MCP_ACCESS_TOKEN: ${{ secrets.MCP_ACCESS_TOKEN }}
          DEPLOY_REF: ${{ github.sha }}
          DEPLOY_REPO: git@github.com:${{ github.repository }}.git
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$PRODUCTION_URL"

          ssh -i ~/.ssh/production_deploy_key \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            "$VPS_USER@$VPS_HOST" \
            "DEPLOY_REPO='$DEPLOY_REPO' DEPLOY_REF='$DEPLOY_REF' DEPLOY_HEALTH_URL='$PRODUCTION_URL/api/health' DEPLOY_DASHBOARD_URL='$PRODUCTION_URL/api/dashboard' DEPLOY_MCP_ACCESS_TOKEN='$MCP_ACCESS_TOKEN' bash -s" \
            < scripts/deploy-production.sh
